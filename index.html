<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task & Earn - Telegram Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #151515; 
            color: #ffffff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: flex-start; 
            min-height: 100vh; 
            padding: 20px;
        }
        h2 { margin-top: 10px; font-weight: 600; font-size: 24px; color: #f5f5f7; }
        .user-id { font-size: 12px; color: #8e8e93; margin-bottom: 25px; }
        
        /* Balance Card */
        .balance-card { 
            background: linear-gradient(135deg, #2c2c2e 0%, #1c1c1e 100%); 
            width: 100%; 
            max-width: 400px; 
            padding: 30px 20px; 
            border-radius: 20px; 
            text-align: center; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            border: 1px solid #3a3a3c;
            margin-bottom: 30px;
        }
        .balance-card h3 { font-size: 14px; color: #0a84ff; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
        .balance-card h1 { font-size: 42px; font-weight: 700; color: #ffd60a; }

        /* Tasks Section */
        .tasks-container { width: 100%; max-width: 400px; text-align: left; }
        .tasks-container h4 { font-size: 16px; color: #8e8e93; margin-bottom: 15px; padding-left: 5px; }
        
        .task-box {
            background-color: #1c1c1e;
            border: 1px solid #2c2c2e;
            padding: 16px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            transition: transform 0.2s;
        }
        .task-box:active { transform: scale(0.98); }
        .task-info h5 { font-size: 15px; font-weight: 600; color: #ffffff; margin-bottom: 4px; }
        .task-info p { font-size: 13px; color: #34c759; font-weight: bold; }
        
        .btn { 
            background-color: #007aff; 
            color: white; 
            border: none; 
            padding: 10px 16px; 
            font-size: 14px; 
            font-weight: 600;
            border-radius: 8px; 
            cursor: pointer; 
        }
        .btn-done { background-color: #3a3a3c; color: #aeaeb2; cursor: not-allowed; }
    </style>
</head>
<body>

    <h2>Baga Gammadde, <span id="username">User</span>!</h2>
    <p class="user-id">ID: <span id="user-id-val">000000000</span></p>

    <div class="balance-card">
        <h3>Points Walitti Qabame</h3>
        <h1 id="balance">0 PTS</h1>
    </div>

    <div class="tasks-container">
        <h4>Hojiiwwan Jiran (Tasks)</h4>
        
        <div class="task-box">
            <div class="task-info">
                <h5>Join Our Telegram Channel</h5>
                <p>+50 PTS</p>
            </div>
            <button id="task1-btn" class="btn" onclick="completeTelegramTask()">🔊 Hojjedhu</button>
        </div>

        <div class="task-box">
            <div class="task-info">
                <h5>Watch Daily Ad</h5>
                <p>+20 PTS</p>
            </div>
            <button class="btn" onclick="watchAdTask()">📺 Daawwadhu</button>
        </div>
    </div>

    <script>
        // Init Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Skiriinii guutuu akka uumuuf

        // Get User Data From Telegram
        let user = tg.initDataUnsafe.user;
        let userId = user ? user.id : "guest_user";
        let uName = user ? user.first_name : "Local Explorer";

        // Display User Data
        document.getElementById('username').innerText = uName;
        document.getElementById('user-id-val').innerText = userId;

        // Key LocalStorage adda uumuuf
        const storageKey = 'tma_pts_' + userId;
        const taskKey = 'tma_task1_' + userId;

        // Load Initial Balance
        let currentPoints = parseInt(localStorage.getItem(storageKey)) || 0;
        document.getElementById('balance').innerText = currentPoints + " PTS";

        // Check if Task 1 is already completed
        if (localStorage.getItem(taskKey) === 'completed') {
            setTask1Done();
        }

        function completeTelegramTask() {
            if (localStorage.getItem(taskKey) === 'completed') return;

            // Link channel keetii asitti jijjiiri
            tg.openTelegramLink('https://t.me/Arsi_University'); 

            // Point kenniif
            addPoints(50);
            
            // Task kana akka irra hin deebine cufi
            localStorage.setItem(taskKey, 'completed');
            setTask1Done();
        }

        function watchAdTask() {
            tg.showAlert("Beeksisa daawwattee xumurteetta! +20 PTS siif dabalameera.");
            addPoints(20);
        }

        function addPoints(pts) {
            currentPoints += pts;
            localStorage.setItem(storageKey, currentPoints);
            document.getElementById('balance').innerText = currentPoints + " PTS";
        }

        function setTask1Done() {
            const btn = document.getElementById('task1-btn');
            btn.innerText = "Xumurameera ✓";
            btn.className = "btn btn-done";
            btn.onclick = null;
        }
    </script>
</body>
</html>
